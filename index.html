<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Print Fabric - Glassware Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-slate-900/5 text-slate-800" x-data="stockApp()">
    
    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2.5 rounded-xl shadow-inner text-white relative">
                    <i class="fa-solid fa-mug-hot text-xl"></i>
                    <span class="absolute -top-1 -right-1 flex h-3 w-3">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                    </span>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight">Smart Print Fabric - Glassware</h1>
                    <p class="text-xs text-slate-400">ระบบจัดการสต๊อกแก้วและกระบอกน้ำอัจฉริยะ (318 รายการ)</p>
                </div>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <button @click="seedToCloud()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up"></i> ซิงค์ 318 รายการขึ้น Cloud
                </button>
                <button @click="openAddModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> เพิ่มสินค้า
                </button>
                <button @click="exportCSV()" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm border border-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-download"></i> ส่งออก CSV
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 space-y-6">
        <!-- Dashboard Stats -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">รายการสินค้า</p>
                    <h3 class="text-2xl font-bold text-slate-800 mt-1" x-text="items.length + ' รายการ'"></h3>
                </div>
                <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center text-xl">
                    <i class="fa-solid fa-boxes-stacked"></i>
                </div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">จำนวนสต๊อกรวม</p>
                    <h3 class="text-2xl font-bold text-emerald-600 mt-1" x-text="totalStock.toLocaleString() + ' ชิ้น'"></h3>
                </div>
                <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center text-xl">
                    <i class="fa-solid fa-warehouse"></i>
                </div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">ใกล้หมด (&lt; 20)</p>
                    <h3 class="text-2xl font-bold text-amber-600 mt-1" x-text="lowStockCount + ' รายการ'"></h3>
                </div>
                <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center text-xl">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">หมดสต๊อก</p>
                    <h3 class="text-2xl font-bold text-rose-600 mt-1" x-text="outOfStockCount + ' รายการ'"></h3>
                </div>
                <div class="w-12 h-12 bg-rose-50 text-rose-600 rounded-2xl flex items-center justify-center text-xl">
                    <i class="fa-solid fa-circle-xmark"></i>
                </div>
            </div>
        </div>

        <!-- Controls & Filters -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="relative w-full md:w-96">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                    <i class="fa-solid fa-search"></i>
                </span>
                <input type="text" x-model="searchQuery" placeholder="ค้นหารหัส, ชื่อสินค้า หรือสี..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                <select x-model="selectedCategory" class="bg-slate-50 border border-slate-200 px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="">ทุกหมวดหมู่</option>
                    <template x-for="cat in categories" :key="cat">
                        <option :value="cat" x-text="cat"></option>
                    </template>
                </select>
                <select x-model="selectedStatus" class="bg-slate-50 border border-slate-200 px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="">สถานะสต๊อกทั้งหมด</option>
                    <option value="normal">ปกติ</option>
                    <option value="low">ใกล้หมด (&lt; 20)</option>
                    <option value="out">หมดสต๊อก</option>
                </select>
            </div>
        </div>

        <!-- Inventory Table -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-100 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                            <th class="py-4 px-6">รหัส ERP / รหัสสินค้า</th>
                            <th class="py-4 px-6 text-center">รูปภาพ</th>
                            <th class="py-4 px-6">ชื่อสินค้า / ขนาด</th>
                            <th class="py-4 px-6">หมวดหมู่</th>
                            <th class="py-4 px-6">สี</th>
                            <th class="py-4 px-6 text-center">คงเหลือ (ชิ้น)</th>
                            <th class="py-4 px-6 text-center">สถานะ</th>
                            <th class="py-4 px-6 text-right">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 text-sm">
                        <template x-for="item in filteredItems" :key="item.code">
                            <tr class="hover:bg-slate-50/80 transition">
                                <td class="py-4 px-6">
                                    <div class="font-medium text-slate-800" x-text="item.code"></div>
                                    <div class="text-xs text-slate-400" x-text="item.erp_code"></div>
                                </td>
                                <td class="py-4 px-6 text-center">
                                    <template x-if="item.image">
                                        <img :src="item.image" class="w-10 h-10 object-cover rounded-xl mx-auto border border-slate-200">
                                    </template>
                                    <template x-if="!item.image">
                                        <div class="w-10 h-10 bg-slate-100 rounded-xl mx-auto flex items-center justify-center text-slate-400 border border-slate-200">
                                            <i class="fa-solid fa-image text-sm"></i>
                                        </div>
                                    </template>
                                </td>
                                <td class="py-4 px-6"><div class="font-medium text-slate-800" x-text="item.name"></div></td>
                                <td class="py-4 px-6"><span class="inline-block bg-slate-100 text-slate-600 px-2.5 py-1 rounded-lg text-xs font-medium" x-text="item.category"></span></td>
                                <td class="py-4 px-6"><span class="text-slate-600" x-text="item.color"></span></td>
                                <td class="py-4 px-6 text-center font-bold" :class="item.stock === 0 ? 'text-rose-600' : (item.stock < 20 ? 'text-amber-600' : 'text-slate-800')" x-text="item.stock.toLocaleString()"></td>
                                <td class="py-4 px-6 text-center">
                                    <template x-if="item.stock === 0">
                                        <span class="bg-rose-50 text-rose-700 px-2.5 py-1 rounded-full text-xs font-medium">หมดสต๊อก</span>
                                    </template>
                                    <template x-if="item.stock > 0 && item.stock < 20">
                                        <span class="bg-amber-50 text-amber-700 px-2.5 py-1 rounded-full text-xs font-medium">ใกล้หมด</span>
                                    </template>
                                    <template x-if="item.stock >= 20">
                                        <span class="bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-full text-xs font-medium">ปกติ</span>
                                    </template>
                                </td>
                                <td class="py-4 px-6 text-right space-x-1">
                                    <button @click="openAdjustModal(item)" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 p-2 rounded-xl transition text-xs" title="ปรับสต๊อก">
                                        <i class="fa-solid fa-arrows-rotate"></i>
                                    </button>
                                    <button @click="openEditModal(item)" class="bg-slate-100 hover:bg-slate-200 text-slate-600 p-2 rounded-xl transition text-xs" title="แก้ไข">
                                        <i class="fa-solid fa-pen"></i>
                                    </button>
                                    <button @click="triggerDelete(item)" class="bg-rose-50 hover:bg-rose-100 text-rose-600 p-2 rounded-xl transition text-xs" title="ลบ">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        </template>
                        <template x-if="filteredItems.length === 0">
                            <tr>
                                <td colspan="8" class="py-12 text-center text-slate-400">
                                    <i class="fa-solid fa-box-open text-3xl mb-2"></i>
                                    <p>ไม่พบรายการสินค้าที่ค้นหา</p>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal: Add / Edit Product -->
    <div x-show="showModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4" x-cloak>
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden">
            <div class="px-6 py-4 bg-slate-900 text-white flex justify-between items-center">
                <h3 class="font-bold text-base" x-text="isEditing ? 'แก้ไขข้อมูลสินค้า' : 'เพิ่มสินค้าใหม่'"></h3>
                <button @click="showModal = false" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form @submit.prevent="triggerSave" class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">หมวดหมู่สินค้า</label>
                    <input type="text" x-model="form.category" required class="w-full bg-slate-50 border border-slate-200 px-4 py-2.5 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">รหัสสินค้า</label>
                        <input type="text" x-model="form.code" required :disabled="isEditing" class="w-full bg-slate-50 border border-slate-200 px-4 py-2.5 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 disabled:opacity-50">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">รหัส ERP</label>
                        <input type="text" x-model="form.erp_code" class="w-full bg-slate-50 border border-slate-200 px-4 py-2.5 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">ชื่อสินค้า / ขนาด</label>
                    <input type="text" x-model="form.name" required class="w-full bg-slate-50 border border-slate-200 px-4 py-2.5 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">สี</label>
                        <input type="text" x-model="form.color" class="w-full bg-slate-50 border border-slate-200 px-4 py-2.5 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">จำนวนคงเหลือ</label>
                        <input type="number" x-model.number="form.stock" min="0" required class="w-full bg-slate-50 border border-slate-200 px-4 py-2.5 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">อัปโหลดรูปภาพสินค้า</label>
                    <input type="file" @change="handleImageUpload" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-600 hover:file:bg-indigo-100">
                </div>
                <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
                    <button type="button" @click="showModal = false" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-sm font-medium hover:bg-slate-200">ยกเลิก</button>
                    <button type="submit" class="px-5 py-2 bg-indigo-600 text-white rounded-xl text-sm font-medium hover:bg-indigo-500">บันทึก</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Stock Adjust -->
    <div x-show="showAdjustModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4" x-cloak>
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden">
            <div class="px-6 py-4 bg-indigo-600 text-white flex justify-between items-center">
                <h3 class="font-bold text-base">ปรับปรุงสต๊อกสินค้า</h3>
                <button @click="showAdjustModal = false" class="text-indigo-200 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <h4 class="font-bold text-slate-800 text-sm" x-text="adjustItem.name"></h4>
                    <p class="text-xs text-slate-400" x-text="'รหัส: ' + adjustItem.code + ' | สี: ' + adjustItem.color"></p>
                    <p class="text-xs font-semibold text-indigo-600 mt-1" x-text="'สต๊อกปัจจุบัน: ' + adjustItem.stock + ' ชิ้น'"></p>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">ประเภทการปรับ</label>
                    <select x-model="adjustType" class="w-full bg-slate-50 border border-slate-200 px-4 py-2.5 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500">
                        <option value="in">➕ รับเข้าสินค้า (Stock In)</option>
                        <option value="out">➖ จ่ายออกสินค้า (Stock Out)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">จำนวน</label>
                    <input type="number" x-model.number="adjustQty" min="1" class="w-full bg-slate-50 border border-slate-200 px-4 py-2.5 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
                    <button type="button" @click="showAdjustModal = false" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-sm font-medium hover:bg-slate-200">ยกเลิก</button>
                    <button type="button" @click="triggerAdjust" class="px-5 py-2 bg-indigo-600 text-white rounded-xl text-sm font-medium hover:bg-indigo-500">ยืนยัน</button>
                </div>
            </div>
        </div>
    </div>

    <!-- สคริปต์ Alpine.js และฝังข้อมูลครบ 318 รายการ -->
    <script>
        const initialExcelItems = ${full_json_str};

        document.addEventListener('alpine:init', () => {
            Alpine.data('stockApp', () => ({
                items: initialExcelItems,
                searchQuery: '',
                selectedCategory: '',
                selectedStatus: '',
                categories: ['Vacuum Mug', 'Vacuum Bottle', 'Vacuum Flask', 'แก้วมัค', 'Ceramic series'],
                
                showModal: false,
                isEditing: false,
                form: { category: 'Vacuum Mug', code: '', erp_code: '', name: '', color: '', stock: 0, image: '' },

                showAdjustModal: false,
                adjustItem: {},
                adjustType: 'in',
                adjustQty: 1,

                init() {
                    window.addEventListener('firebase-data-update', (e) => {
                        const cloudData = e.detail;
                        if (cloudData && cloudData.length > 0) {
                            cloudData.forEach(cloudItem => {
                                const index = this.items.findIndex(i => i.code === cloudItem.code);
                                if (index !== -1) {
                                    this.items[index].stock = cloudItem.stock;
                                    if (cloudItem.image) this.items[index].image = cloudItem.image;
                                } else {
                                    this.items.unshift(cloudItem);
                                }
                            });
                        }
                    });
                },

                get totalStock() { return this.items.reduce((sum, i) => sum + (i.stock || 0), 0); },
                get lowStockCount() { return this.items.filter(i => i.stock > 0 && i.stock < 20).length; },
                get outOfStockCount() { return this.items.filter(i => i.stock === 0).length; },
                get filteredItems() {
                    return this.items.filter(i => {
                        const matchQuery = (i.name || '').toLowerCase().includes(this.searchQuery.toLowerCase()) || 
                                           (i.code || '').toLowerCase().includes(this.searchQuery.toLowerCase()) ||
                                           (i.color || '').toLowerCase().includes(this.searchQuery.toLowerCase());
                        const matchCat = this.selectedCategory === '' || i.category === this.selectedCategory;
                        
                        let matchStatus = true;
                        if (this.selectedStatus === 'normal') matchStatus = i.stock >= 20;
                        else if (this.selectedStatus === 'low') matchStatus = i.stock > 0 && i.stock < 20;
                        else if (this.selectedStatus === 'out') matchStatus = i.stock === 0;

                        return matchQuery && matchCat && matchStatus;
                    });
                },

                openAddModal() {
                    this.isEditing = false;
                    this.form = { category: 'Vacuum Mug', code: '', erp_code: '', name: '', color: '', stock: 0, image: '' };
                    this.showModal = true;
                },
                openEditModal(item) {
                    this.isEditing = true;
                    this.form = { ...item };
                    this.showModal = true;
                },
                openAdjustModal(item) {
                    this.adjustItem = item;
                    this.adjustType = 'in';
                    this.adjustQty = 1;
                    this.showAdjustModal = true;
                },
                handleImageUpload(event) {
                    const file = event.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            this.form.image = e.target.result;
                        };
                        reader.readAsDataURL(file);
                    }
                },
                triggerSave() {
                    window.dispatchEvent(new CustomEvent('save-item', { detail: { ...this.form } }));
                    const index = this.items.findIndex(i => i.code === this.form.code);
                    if (index !== -1) {
                        this.items[index] = { ...this.form };
                    } else {
                        this.items.unshift({ ...this.form });
                    }
                    this.showModal = false;
                },
                triggerDelete(item) {
                    if (confirm(`คุณต้องการลบสินค้า "${item.name} (${item.color})" ใช่หรือไม่?`)) {
                        window.dispatchEvent(new CustomEvent('delete-item', { detail: { code: item.code } }));
                        this.items = this.items.filter(i => i.code !== item.code);
                    }
                },
                triggerAdjust() {
                    if (this.adjustType === 'out' && this.adjustItem.stock < parseInt(this.adjustQty)) {
                        alert("ยอดสต๊อกคงเหลือไม่เพียงพอสำหรับการจ่ายออก!");
                        return;
                    }
                    const amount = this.adjustType === 'in' ? parseInt(this.adjustQty) : -parseInt(this.adjustQty);
                    const index = this.items.findIndex(i => i.code === this.adjustItem.code);
                    if (index !== -1) {
                        this.items[index].stock = Math.max(0, this.items[index].stock + amount);
                    }
                    window.dispatchEvent(new CustomEvent('adjust-stock', { 
                        detail: { code: this.adjustItem.code, amount: amount } 
                    }));
                    this.showAdjustModal = false;
                },
                seedToCloud() {
                    if (confirm("ต้องการซิงค์ข้อมูลสินค้าทั้ง 318 รายการขึ้นสู่ Cloud Firebase ทันทีใช่หรือไม่?")) {
                        window.dispatchEvent(new CustomEvent('force-seed', { detail: this.items }));
                        alert("กำลังส่งข้อมูลขึ้น Cloud... รอสักครู่แล้วรีเฟรชหน้าเว็บครับ");
                    }
                },
                exportCSV() {
                    let csv = '\uFEFFรหัสERP,รหัสสินค้า,ชื่อสินค้า/ขนาด,หมวดหมู่,สี,จำนวนคงเหลือ\n';
                    this.filteredItems.forEach(i => {
                        csv += `"${i.erp_code}","${i.code}","${i.name}","${i.category}","${i.color}",${i.stock}\n`;
                    });
                    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = 'SmartPrintFabric_Glass_Inventory.csv';
                    link.click();
                }
            }));

    <!-- สคริปต์ Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, updateDoc, increment, getDocs } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA1Azn_bhk34_kTci5OIW01aR4-JsS8rJs",
            authDomain: "stockglass-295ad.firebaseapp.com",
            projectId: "stockglass-295ad",
            storageBucket: "stockglass-295ad.firebasestorage.app",
            messagingSenderId: "798605537807",
            appId: "1:798605537807:web:8e08102c1f5ef31e1e297a",
            measurementId: "G-085TYPQ572"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const inventoryCol = collection(db, "glass_inventory");

        // อัตโนมัติซิงค์ถ้าฐานข้อมูลยังว่าง
        async function autoSeed() {
            try {
                const snapshot = await getDocs(inventoryCol);
                if (snapshot.empty) {
                    for (let item of initialExcelItems) {
                        await setDoc(doc(db, "glass_inventory", item.code), item);
                    }
                }
            } catch (err) {
                console.error(err);
            }
        }

        autoSeed().then(() => {
            onSnapshot(inventoryCol, (snapshot) => {
                let fetchedItems = [];
                snapshot.forEach((doc) => {
                    fetchedItems.push(doc.data());
                });
                if (fetchedItems.length > 0) {
                    window.dispatchEvent(new CustomEvent('firebase-data-update', { detail: fetchedItems }));
                }
            }, (error) => {
                console.error("Firebase Error:", error);
            });
        });

        window.addEventListener('force-seed', async (e) => {
            try {
                for (let item of e.detail) {
                    await setDoc(doc(db, "glass_inventory", item.code), item);
                }
                alert("อัปโหลดข้อมูลทั้ง 318 รายการขึ้น Cloud สำเร็จ!");
            } catch (err) {
                alert("เกิดข้อผิดพลาดในการซิงค์: " + err.message);
            }
        });

        window.addEventListener('save-item', async (e) => {
            try {
                await setDoc(doc(db, "glass_inventory", e.detail.code), e.detail);
            } catch (error) { console.error(error); }
        });

        window.addEventListener('delete-item', async (e) => {
            try {
                await deleteDoc(doc(db, "glass_inventory", e.detail.code));
            } catch (error) { console.error(error); }
        });

        window.addEventListener('adjust-stock', async (e) => {
            try {
                await updateDoc(doc(db, "glass_inventory", e.detail.code), {
                    stock: increment(e.detail.amount)
                });
            } catch (error) { console.error(error); }
        });
    </script>
